experiment:
  name: tabular_counterfactual_experiment
data:
  input_type: tabular
  source: flight_logs
  log_dir: data/logs
  max_files: 5
  feature_names:
    - altitude
    - speed
    - obstacle_dist
    - battery
    - obstacle_density
    - yaw
    - roll
    - pitch
    - distance_to_target
    - angle_to_target
model:
  name: random_forest
  n_estimators: 50
  random_state: 42
xai:
  method: counterfactual
  target: predicted
  test_index: 0
metrics:
  enabled: false
output:
  root: results/tabular