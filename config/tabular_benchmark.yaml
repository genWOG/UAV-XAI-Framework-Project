experiment:
  name: tabular_benchmark_lime_shap

data:
  input_type: tabular
  source: synthetic
  n_samples: 500
  seed: 42
  feature_names:
    - altitude
    - speed
    - obstacle_dist
    - battery
    - obstacle_density
    - yaw
    - roll
    - pitch
    - distance_to_target
    - angle_to_target

model:
  name: random_forest
  n_estimators: 50
  random_state: 42

xai:
  methods:
    - lime
    - shap
  test_index: 0
  # LIME
  num_samples: 500
  # SHAP
  nsamples: 100
  background_size: 100

metrics:
  enabled: false

output:
  root: results/tabular