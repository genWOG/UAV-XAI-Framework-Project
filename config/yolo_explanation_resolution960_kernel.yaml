experiment:
  name: yolo_explanation_resolution960_kernel
model:
  name: yolo26n
  task: detection
  weights: yolo26n.pt
  prediction_confidence_threshold: 0.001
image:
  path: data/images/modern_ship.jpg
xai:
  input_type: image
  method: grad_cam
  image_size: 640
  detection_iou_threshold: 0.2
  detection_score_threshold: 0.05
  detection_top_k: 8
  methods:
  - lime
  - shap
  num_samples: 400
  nsamples: 256
  num_segments: 60
  compactness: 10.0
  hide_color: 0
  lime_iou_threshold: 0.5
  method_configs:
    lime:
      num_samples: 256
      num_segments: 64
      compactness: 10.0
      hide_color: null
      target_iou_threshold: 0.5
      explanation_image_size: 960
    shap:
      nsamples: 256
      num_segments: 32
      compactness: 10.0
      hide_color: 0
      baseline_mode: segment_mean
      target_iou_threshold: 0.5
      explanation_image_size: 960
      algorithm: kernel
target:
  type: detection
  index: 0
metrics:
  enabled: true
  steps: 20
  baseline_value: 0.0
  iou_threshold: 0.5
output:
  root: results
methods:
- lime
- shap
