experiment:
  name: yolo_detection
model:
  name: yolo26n
  task: detection
  weights: yolo26n.pt
image:
  path: data/images/modern_ship.jpg
xai:
  input_type: image
  method: grad_cam
  image_size: 640
  detection_iou_threshold: 0.2
  detection_score_threshold: 0.05
  detection_top_k: 8
  methods:
  - grad_cam
  - lime
  - shap
  - lrp
  num_samples: 400
  nsamples: 256
  num_segments: 60
  compactness: 10.0
  hide_color: 0
  lime_iou_threshold: 0.5
  method_configs:
    lime:
      num_samples: 800
      num_segments: 100
      compactness: 10.0
      hide_color: null
      target_iou_threshold: 0.5
    shap:
      nsamples: 512
      num_segments: 50
      compactness: 10.0
      hide_color: 0
      baseline_mode: segment_mean
      target_iou_threshold: 0.5
    lrp:
      epsilon: 1.0e-06
      gamma: 0.1
      low: 0.0
      high: 1.0
target:
  type: detection
  index: 0
metrics:
  enabled: true
  steps: 20
  baseline_value: 0.0
  iou_threshold: 0.5
output:
  root: results
methods:
- grad_cam
- lime
- shap
- lrp
