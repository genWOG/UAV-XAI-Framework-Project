# Конфиг для запуска XAI на нашей кастомной модели дрона (UAV Obstacles)
experiment:
  name: uav_custom_yolo_explanation

model:
  name: yolo
  task: detection
  weights: runs/detect/uav_obstacles_v2/weights/best.pt  # НАШИ ВЕСА
  prediction_confidence_threshold: 0.05                  # Порог уверенности

image:
  path: data/datasets/uav_obstacles/images/train/frame_20261009_201400_388816.jpg  # НАШ КАДР

xai:
  input_type: image
  method: lime  # По умолчанию
  image_size: 640
  detection_iou_threshold: 0.2
  detection_score_threshold: 0.05
  detection_top_k: 8
  target_layer: "21"
  methods:
    - grad_cam
    - lime
    - shap
    - lrp
  method_configs:
    grad_cam:
    lime:
      num_samples: 64        # Уменьшили для скорости
      num_segments: 16        # Уменьшили для скорости
      compactness: 10.0
      hide_color: null
      target_iou_threshold: 0.5
      target_score_mode: confidence_iou
    shap:
      nsamples: 64           # Уменьшили для скорости
      num_segments: 16        # Уменьшили для скорости
      compactness: 10.0
      hide_color: 0
      baseline_mode: segment_mean
      algorithm: kernel
      target_iou_threshold: 0.5
      target_score_mode: confidence_iou
    lrp:
      epsilon: 1.0e-06
      gamma: 0.1
      low: 0.0
      high: 1.0

target:
  type: detection
  index: 0  # Объясняем первый найденный объект (например, стену)

metrics:
  enabled: true
  steps: 20
  baseline_value: 0.0
  iou_threshold: 0.5

output:
  root: results/xai_custom_yolo