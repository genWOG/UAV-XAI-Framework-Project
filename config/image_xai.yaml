experiment:
  name: bmw_image_xai

image:
  path: data/images/test.jpg

model:
  name: resnet18

xai:
  input_type: image
  method: lrp
  target_layer: layer4[-1].conv2
  nsamples: 100
  num_segments: 30
  compactness: 10.0
  hide_color: 0

metrics:
  enabled: true
  steps: 20
  baseline_value: 0.0

output:
  root: results